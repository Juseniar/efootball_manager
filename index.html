  <script>
    // ── SPOTLIGHT ─────────────────────────────────────────────────────────────────
    let spotlightIdx = -1;

    function abrirSpotlight() {
      document.getElementById('spotlight-overlay').classList.remove('oculto');
      const inp = document.getElementById('spotlight-input');
      inp.value = '';
      spotlightIdx = -1;
      renderSpotlight('');
      setTimeout(() => inp.focus(), 30);
    }

    function cerrarSpotlight() {
      document.getElementById('spotlight-overlay').classList.add('oculto');
      spotlightIdx = -1;
    }

    function renderSpotlight(q) {
      const res = document.getElementById('spotlight-results');
      q = q.toLowerCase().trim();
      if (!q) {
        res.innerHTML = '<div class="spl-empty">Escribe para buscar jugadores o técnicos...</div>';
        return;
      }
      const jugRes = jugadores.filter(j =>
        (j.nombre || '').toLowerCase().includes(q) ||
        (j.posicion || '').toLowerCase().includes(q) ||
        (j.equipo || '').toLowerCase().includes(q)
      ).slice(0, 6);
      const tecRes = tecnicos.filter(t =>
        (t.nombre || '').toLowerCase().includes(q) ||
        (t.formacion || '').toLowerCase().includes(q)
      ).slice(0, 4);

      if (!jugRes.length && !tecRes.length) {
        res.innerHTML = '<div class="spl-empty">Sin resultados para "' + q + '"</div>';
        return;
      }
      let html = '';
      if (jugRes.length) {
        html += '<div class="spl-grupo">Jugadores</div>';
        jugRes.forEach((j, i) => {
          const ovr = j.overall || '—';
          const pos = j.posicion || '';
          html += `<div class="spl-item" data-type="jugador" data-id="${j.id}" tabindex="-1">
            ${j.imagen ? `<img class="spl-img" src="${j.imagen}" alt="" onerror="this.style.display='none'">` : '<div class="spl-img spl-img-fb">🧑</div>'}
            <div class="spl-info">
              <div class="spl-nombre">${j.nombre || '—'}</div>
              <div class="spl-meta">${pos ? `<span class="spl-pill">${pos}</span>` : ''}${j.equipo ? `<span class="spl-pill">${j.equipo}</span>` : ''}</div>
            </div>
            <div class="spl-ovr">${ovr}</div>
          </div>`;
        });
      }
      if (tecRes.length) {
        html += '<div class="spl-grupo">Técnicos</div>';
        tecRes.forEach((t) => {
          html += `<div class="spl-item" data-type="tecnico" data-id="${t.id}" tabindex="-1">
            <div class="spl-img spl-img-fb">🧑‍💼</div>
            <div class="spl-info">
              <div class="spl-nombre">${t.nombre || '—'}</div>
              <div class="spl-meta">${t.formacion ? `<span class="spl-pill">${t.formacion}</span>` : ''}${t.edicion ? `<span class="spl-pill">${t.edicion}</span>` : ''}</div>
            </div>
          </div>`;
        });
      }
      res.innerHTML = html;
      res.querySelectorAll('.spl-item').forEach(el => {
        el.addEventListener('click', () => spotlightAbrir(el));
      });
      spotlightIdx = -1;
    }

    function spotlightAbrir(el) {
      const type = el.dataset.type;
      const id = el.dataset.id;
      cerrarSpotlight();
      if (type === 'jugador') {
        verJugador(id, true);
      } else {
        cambiarTab('tecnicos');
        setTimeout(() => abrirCarpeta(id), 150);
      }
    }

    function spotlightNavegar(e) {
      const items = document.querySelectorAll('#spotlight-results .spl-item');
      if (!items.length) return;
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        spotlightIdx = Math.min(spotlightIdx + 1, items.length - 1);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        spotlightIdx = Math.max(spotlightIdx - 1, 0);
      } else if (e.key === 'Enter' && spotlightIdx >= 0) {
        e.preventDefault();
        spotlightAbrir(items[spotlightIdx]);
        return;
      }
      items.forEach((el, i) => el.classList.toggle('activo', i === spotlightIdx));
      if (items[spotlightIdx]) items[spotlightIdx].scrollIntoView({ block: 'nearest' });
    }

    document.getElementById('spotlight-input').addEventListener('input', e => {
      spotlightIdx = -1;
      renderSpotlight(e.target.value);
    });
    document.getElementById('spotlight-input').addEventListener('keydown', spotlightNavegar);

    document.addEventListener('keydown', e => {
      const overlay = document.getElementById('spotlight-overlay');
      const abierto = !overlay.classList.contains('oculto');
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        abierto ? cerrarSpotlight() : abrirSpotlight();
      } else if (e.key === '/' && !abierto && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
        e.preventDefault();
        abrirSpotlight();
      } else if (e.key === 'Escape' && abierto) {
        cerrarSpotlight();
      }
    });
  </script>

  <!-- SQUAD BUILDER PREVIEW -->
  <div class="squad-preview-overlay oculto" id="squad-overlay">
    <div class="squad-preview-box">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="squad-preview-titulo">📸 Squad Builder</div>
        <button onclick="document.getElementById('squad-overlay').classList.add('oculto')" style="background:var(--muted);border:none;color:var(--texto);cursor:pointer;width:32px;height:32px;border-radius:50%;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0">✕</button>
      </div>
      <div class="squad-preview-sub">Tu plantilla completa ordenada por posición</div>
      <canvas class="squad-preview-canvas" id="squad-canvas"></canvas>
      <div class="squad-preview-acciones">
        <button class="btn-sm" onclick="document.getElementById('squad-overlay').classList.add('oculto')">✕ Cerrar</button>
        <button class="btn-sm btn-sm-oro" id="squad-dl-btn" onclick="descargarSquad()">📥 Descargar PNG</button>
      </div>
    </div>
  </div>

  <script>
  // ── SQUAD BUILDER ─────────────────────────────────────────────────────────────
  const POS_LINEAS = {
    PT:  0,
    LI:  1, DC: 1, LD: 1,
    MCD: 2, MDI: 2, MDD: 2,
    MC:  3, MO: 3,
    EXI: 4, EXD: 4, CAI: 4, CAD: 4,
    SD:  5, CD: 5
  };

  async function exportarSquadBuilder(tid) {
    const btn = document.querySelector(`button[onclick="exportarSquadBuilder('${tid}')"]`);
    if (btn) { btn.textContent = '⏳...'; btn.disabled = true; }

    // Get only players assigned to this tecnico
    const tec = tecnicos.find(t => t.id === tid) || {};
    const plantilla = plantillas[tid] || {};
    const posiciones = plantilla.posiciones || [];
    const jugadoresAsignados = posiciones
      .map(p => jugadores.find(j => j.id === p.jugador_id))
      .filter(Boolean);

    const jugadoresSquad = jugadoresAsignados.length > 0 ? jugadoresAsignados : jugadores;

    // Group players by line
    const lineas = [[], [], [], [], [], []];
    [...jugadoresSquad]
      .sort((a, b) => (parseInt(b.overall) || 0) - (parseInt(a.overall) || 0))
      .forEach(j => {
        const l = POS_LINEAS[j.posicion] ?? 5;
        lineas[l].push(j);
      });
    // Remove empty lines
    const lineasActivas = lineas.filter(l => l.length > 0);

    // Canvas dimensions
    const CARD_W = 130, CARD_H = 170, GAP_X = 14, GAP_Y = 20;
    const maxPerLine = Math.max(...lineasActivas.map(l => l.length), 1);
    const COLS = Math.min(maxPerLine, 6);
    const W = COLS * (CARD_W + GAP_X) + GAP_X + 40;
    const HEADER_H = 72;
    const H = lineasActivas.length * (CARD_H + GAP_Y) + GAP_Y + HEADER_H + 50;

    const canvas = document.getElementById('squad-canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    // Background - field gradient
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0,   '#0a1f0a');
    bg.addColorStop(0.5, '#0d280d');
    bg.addColorStop(1,   '#0a1f0a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Field stripes
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,.025)' : 'transparent';
      ctx.fillRect(0, i * H / 10, W, H / 10);
    }

    // Field lines
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(20, HEADER_H, W - 40, H - HEADER_H - 20);
    ctx.beginPath();
    ctx.moveTo(20, H / 2);
    ctx.lineTo(W - 20, H / 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, 60, 0, Math.PI * 2);
    ctx.stroke();

    // Header
    const hGrad = ctx.createLinearGradient(0, 0, W, 0);
    hGrad.addColorStop(0,   'rgba(240,180,41,.0)');
    hGrad.addColorStop(0.5, 'rgba(240,180,41,.18)');
    hGrad.addColorStop(1,   'rgba(240,180,41,.0)');
    ctx.fillStyle = hGrad;
    ctx.fillRect(0, 0, W, HEADER_H);

    ctx.fillStyle = '#f0b429';
    ctx.font = 'bold 28px "Bebas Neue", Arial';
    ctx.textAlign = 'center';
    ctx.fillText((tec.nombre || 'MI PLANTILLA').toUpperCase(), W / 2, 34);

    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.font = '600 13px Inter, Arial';
    const prom = jugadoresSquad.length ? (jugadoresSquad.reduce((a,j)=>a+(parseInt(j.overall)||0),0)/jugadoresSquad.length).toFixed(1) : '—';
    ctx.fillText(`${jugadoresSquad.length} jugadores · OVR prom. ${prom}${tec.formacion ? ' · ' + tec.formacion : ''}`, W / 2, 56);

    // Preload images
    const imgCache = {};
    await Promise.all(jugadoresSquad.filter(j => j.imagen).map(j =>
      new Promise(res => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => { imgCache[j.id] = img; res(); };
        img.onerror = res;
        img.src = j.imagen;
      })
    ));

    // Draw each line
    lineasActivas.forEach((linea, li) => {
      const count = linea.length;
      const totalW = count * CARD_W + (count - 1) * GAP_X;
      const startX = (W - totalW) / 2;
      // Lines go from GK (bottom) to attackers (top)
      const lineY = HEADER_H + GAP_Y + (lineasActivas.length - 1 - li) * (CARD_H + GAP_Y);

      linea.forEach((j, ci) => {
        const cx = startX + ci * (CARD_W + GAP_X);
        const cy = lineY;
        drawCard(ctx, j, cx, cy, CARD_W, CARD_H, imgCache[j.id]);
      });
    });

    // Watermark
    ctx.fillStyle = 'rgba(255,255,255,.1)';
    ctx.font = '600 12px Inter, Arial';
    ctx.textAlign = 'center';
    ctx.fillText('eFootball Manager', W / 2, H - 8);

    // Show preview
    document.getElementById('squad-overlay').classList.remove('oculto');
    if (btn) { btn.textContent = '📸 Squad'; btn.disabled = false; }
  }

  function drawCard(ctx, j, x, y, W, H, imgEl) {
    const R = 10;

    // Card shadow
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.7)';
    ctx.shadowBlur = 18;
    ctx.shadowOffsetY = 6;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, W, H, R) : ctx.rect(x, y, W, H);
    ctx.fillStyle = '#0e1828';
    ctx.fill();
    ctx.restore();

    // Card background gradient
    const cardGrad = ctx.createLinearGradient(x, y, x, y + H);
    cardGrad.addColorStop(0, '#1a2540');
    cardGrad.addColorStop(1, '#0e1520');
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, W, H, R) : ctx.rect(x, y, W, H);
    ctx.fillStyle = cardGrad;
    ctx.fill();

    // Player image - top 65% of card
    const imgH = Math.floor(H * 0.63);
    if (imgEl) {
      ctx.save();
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, W, imgH, [R, R, 0, 0]) : ctx.rect(x, y, W, imgH);
      ctx.clip();
      // Scale by width, anchor to top (no stretch)
      const scale = W / imgEl.naturalWidth;
      const dw = W;
      const dh = imgEl.naturalHeight * scale;
      ctx.drawImage(imgEl, x, y, dw, dh);
      ctx.restore();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.05)';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x, y, W, imgH, [R, R, 0, 0]) : ctx.rect(x, y, W, imgH);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.2)';
      ctx.font = `${Math.floor(imgH * 0.45)}px Arial`;
      ctx.textAlign = 'center';
      ctx.fillText('🧑', x + W / 2, y + imgH * 0.65);
    }

    // Gradient overlay bottom of image for text readability
    const fadeGrad = ctx.createLinearGradient(x, y + imgH * 0.5, x, y + imgH);
    fadeGrad.addColorStop(0, 'transparent');
    fadeGrad.addColorStop(1, 'rgba(10,18,32,.92)');
    ctx.fillStyle = fadeGrad;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, W, imgH, [R, R, 0, 0]) : ctx.rect(x, y, W, imgH);
    ctx.fill();

    // OVR badge top-left
    const ovrBgGrad = ctx.createLinearGradient(x + 6, y + 6, x + 6, y + 32);
    ovrBgGrad.addColorStop(0, '#f0b429');
    ovrBgGrad.addColorStop(1, '#c88a00');
    ctx.fillStyle = ovrBgGrad;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x + 6, y + 6, 36, 26, 6) : ctx.rect(x + 6, y + 6, 36, 26);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(j.overall || '—', x + 24, y + 23);

    // Position badge top-right
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x + W - 42, y + 6, 36, 22, 5) : ctx.rect(x + W - 42, y + 6, 36, 22);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(j.posicion || '', x + W - 24, y + 21);

    // Bottom info section
    const infoY = y + imgH;
    const infoH = H - imgH;

    // Name
    const apellido = (j.nombre || '').split(' ').slice(-1)[0];
    const firstName = (j.nombre || '').split(' ')[0];
    const displayName = apellido.length > 10 ? apellido.substring(0, 10) + '…' : apellido;

    ctx.fillStyle = '#e8eaf0';
    ctx.font = `bold ${W > 110 ? 13 : 11}px Inter, Arial`;
    ctx.textAlign = 'center';
    ctx.fillText(displayName, x + W / 2, infoY + infoH * 0.42);

    // Team (small)
    const team = (j.equipo || '').substring(0, 14);
    ctx.fillStyle = 'rgba(255,255,255,.38)';
    ctx.font = `${W > 110 ? 9 : 8}px Inter, Arial`;
    ctx.fillText(team, x + W / 2, infoY + infoH * 0.72);

    // Card border
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, W, H, R) : ctx.rect(x, y, W, H);
    ctx.stroke();

    // Gold border for high OVR
    const ovr = parseInt(j.overall) || 0;
    if (ovr >= 99) {
      ctx.strokeStyle = 'rgba(240,180,41,.9)';
      ctx.lineWidth = 2;
    } else if (ovr >= 97) {
      ctx.strokeStyle = 'rgba(240,180,41,.5)';
      ctx.lineWidth = 1.5;
    } else if (ovr >= 95) {
      ctx.strokeStyle = 'rgba(255,255,255,.25)';
      ctx.lineWidth = 1;
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,.1)';
      ctx.lineWidth = 1;
    }
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, W, H, R) : ctx.rect(x, y, W, H);
    ctx.stroke();
  }

  function descargarSquad() {
    const canvas = document.getElementById('squad-canvas');
    const link = document.createElement('a');
    link.download = 'mi_plantilla_efootball.png';
    link.href = canvas.toDataURL('image/png', 1.0);
    link.click();
  }

  // Close overlay clicking outside
  document.getElementById('squad-overlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('oculto');
  });
  </script>

</body>
