<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eFootball Manager</title>
  <link rel="icon" id="favicon" href="" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --negro: #080a0f;
      --oscuro: #0e1218;
      --card: #141820;
      --borde: #1e2535;
      --oro: #f0b429;
      --oro2: #e09a00;
      --verde: #10b981;
      --rojo: #ef4444;
      --azul: #2563eb;
      --texto: #e8eaf0;
      --apagado: #5a6475;
      --muted: #3a4255;
    }

    /* ── MODO CLARO ── */
    body.modo-claro {
      --negro: #f0f2f7;
      --oscuro: #e4e8f0;
      --card: #ffffff;
      --borde: #c8d0e0;
      --texto: #0f1623;
      --apagado: #5a6680;
      --muted: #c0c8d8;
      --verde: #059669;
      --rojo: #dc2626;
      --azul: #1d4ed8;
    }

    body.modo-claro .header {
      background: linear-gradient(90deg, #e4e8f0, #d8e0f0 50%, #e4e8f0);
    }

    body.modo-claro .logo span {
      background: linear-gradient(90deg, #d4900a 0%, #0f1623 25%, #d4900a 50%, #1a2535 75%, #d4900a 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(180, 120, 10, .25));
    }

    body.modo-claro .carta {
      background: linear-gradient(160deg, #d0d8ea, #b8c4dc);
      border-color: #9aaac0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .15);
    }

    body.modo-claro .carta-grad {
      background: linear-gradient(0deg, rgba(230, 236, 248, .98) 0%, rgba(230, 236, 248, .7) 55%, transparent);
    }

    body.modo-claro .carta-nombre {
      color: #0f1623
    }

    body.modo-claro .tec-card {
      background: #fff;
      border-color: #c8d0e0
    }

    body.modo-claro .tec-card:hover {
      border-color: var(--oro)
    }

    body.modo-claro .modal,
    body.modo-claro .form-modal {
      background: #fff
    }

    body.modo-claro .det-header {
      background: linear-gradient(135deg, #e8edf8, #f5f7fc)
    }

    body.modo-claro .historial-entry {
      background: #f0f4fc
    }

    body.modo-claro .fg input,
    body.modo-claro .fg select,
    body.modo-claro .fg textarea {
      background: #f0f4fc;
      border-color: #c8d0e0;
      color: #0f1623;
    }

    body.modo-claro .buscar,
    .modo-claro .filtro {
      background: #fff;
      border-color: #c8d0e0;
      color: #0f1623
    }

    body.modo-claro .campo {
      background: linear-gradient(180deg, #1a7a1a, #1e8822 25%, #1a7a1a 50%, #1e8822 75%, #1a7a1a);
    }

    body.modo-claro .vacio h3 {
      color: #8898b8
    }

    /* Toggle button */
    .modo-toggle {
      background: none;
      border: 1px solid var(--borde);
      border-radius: 8px;
      color: var(--apagado);
      cursor: pointer;
      padding: 7px 10px;
      font-size: .85rem;
      transition: all .2s;
      flex-shrink: 0;
      line-height: 1;
    }

    .modo-toggle:hover {
      border-color: var(--oro);
      color: var(--oro)
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: var(--negro);
      color: var(--texto);
      font-family: 'Inter', sans-serif;
      min-height: 100vh
    }

    .header {
      background: linear-gradient(90deg, #080a0f, #0e1a30 50%, #080a0f);
      border-bottom: 1px solid var(--borde);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
      position: sticky;
      top: 0;
      z-index: 300
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0
    }

    .logo-escudo {
      height: 40px;
      width: auto;
      max-width: 52px;
      object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .55));
      transition: transform .3s
    }

    .logo:hover .logo-escudo {
      transform: scale(1.06)
    }

    @keyframes logoShimmer {
      0% {
        background-position: 200% center
      }

      100% {
        background-position: -200% center
      }
    }

    .logo span {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: .12em;
      background: linear-gradient(90deg, #f0b429 0%, #fff8e0 25%, #f0b429 50%, #ffe180 75%, #f0b429 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: logoShimmer 4s linear infinite;
      filter: drop-shadow(0 0 12px rgba(240, 180, 41, .35));
      text-transform: uppercase
    }

    .tabs {
      display: flex;
      gap: 2px;
      margin-left: auto
    }

    .tab {
      padding: 6px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      transition: all .2s;
      background: transparent;
      color: var(--apagado)
    }

    .tab.activo {
      background: var(--oro);
      color: #000
    }

    .tab:hover:not(.activo) {
      background: var(--borde);
      color: var(--texto)
    }

    #btn-nuevo {
      padding: 7px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--oro);
      color: #000;
      transition: all .2s
    }

    #btn-nuevo:hover {
      background: var(--oro2)
    }

    .breadcrumb {
      padding: 10px 24px;
      background: var(--oscuro);
      border-bottom: 1px solid var(--borde);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .85rem;
      color: var(--apagado)
    }

    .btn-back {
      background: none;
      border: 1px solid var(--borde);
      color: var(--apagado);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .8rem;
      transition: all .2s
    }

    .btn-back:hover {
      border-color: var(--oro);
      color: var(--oro)
    }

    .toolbar {
      padding: 14px 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: var(--oscuro);
      border-bottom: 1px solid var(--borde)
    }

    .buscar {
      flex: 1;
      max-width: 320px;
      padding: 9px 14px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--borde);
      color: var(--texto);
      font-size: .9rem;
      outline: none;
      transition: border .2s
    }

    .buscar:focus {
      border-color: var(--oro)
    }

    .filtro {
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--borde);
      color: var(--texto);
      font-size: .85rem;
      outline: none;
      cursor: pointer
    }

    .contador {
      margin-left: auto;
      color: var(--apagado);
      font-size: .82rem
    }

    /* GRIDS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      column-gap: 16px;
      row-gap: 32px;
      padding: 20px 24px;
      position: relative;
      z-index: 1
    }

    .grid-tec {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
      padding: 20px 24px;
      position: relative;
      z-index: 1
    }

    /* CARTA */
    .carta {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 3/4;
      background: linear-gradient(160deg, #0e1520, #1a2540);
      border: 2px solid #2a3a55;
      transition: transform .25s, box-shadow .25s;
      box-shadow: 0 4px 16px #00000060
    }

    @keyframes cartaGlow {
      0% {
        box-shadow: 0 20px 60px rgba(240, 180, 41, .7), 0 0 40px rgba(240, 180, 41, .4), inset 0 0 20px rgba(240, 180, 41, .05);
        border-color: #f0b429;
      }

      25% {
        box-shadow: 0 20px 60px rgba(239, 68, 68, .7), 0 0 40px rgba(239, 68, 68, .4), inset 0 0 20px rgba(239, 68, 68, .05);
        border-color: #ef4444;
      }

      50% {
        box-shadow: 0 20px 60px rgba(99, 102, 241, .7), 0 0 40px rgba(99, 102, 241, .4), inset 0 0 20px rgba(99, 102, 241, .05);
        border-color: #818cf8;
      }

      75% {
        box-shadow: 0 20px 60px rgba(16, 185, 129, .7), 0 0 40px rgba(16, 185, 129, .4), inset 0 0 20px rgba(16, 185, 129, .05);
        border-color: #10b981;
      }

      100% {
        box-shadow: 0 20px 60px rgba(240, 180, 41, .7), 0 0 40px rgba(240, 180, 41, .4), inset 0 0 20px rgba(240, 180, 41, .05);
        border-color: #f0b429;
      }
    }

    @keyframes cartaFlip {
      0% {
        transform: translateY(-14px) scale(1.1) rotate(-2deg);
      }

      30% {
        transform: translateY(-16px) scale(1.12) rotate(2.5deg);
      }

      60% {
        transform: translateY(-13px) scale(1.11) rotate(-1.5deg);
      }

      100% {
        transform: translateY(-14px) scale(1.1) rotate(1deg);
      }
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-150%) skewX(-15deg);
        opacity: 0;
      }

      30% {
        opacity: 1;
      }

      100% {
        transform: translateX(250%) skewX(-15deg);
        opacity: 0;
      }
    }

    .carta::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 10;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .22) 50%, transparent 100%);
      transform: translateX(-150%) skewX(-15deg);
      pointer-events: none;
    }

    .carta:hover {
      animation: cartaFlip 1.8s ease-in-out infinite, cartaGlow 2s linear infinite;
      border-width: 2.5px;
      z-index: 100;
    }

    .carta:hover::after {
      animation: shimmer 1.2s ease-in-out infinite;
    }

    .carta img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top
    }

    .carta-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      color: var(--muted)
    }

    .carta-grad {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 55%;
      background: linear-gradient(0deg, rgba(5, 8, 14, .98), rgba(5, 8, 14, .65) 55%, transparent);
      z-index: 2
    }

    .carta-ovr {
      position: absolute;
      top: 8px;
      left: 10px;
      z-index: 4;
      line-height: 1
    }

    .carta-ovr-n {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      color: #fff;
      display: block;
      text-shadow: 0 0 20px rgba(240, 180, 41, .5), 0 2px 8px rgba(0, 0, 0, .9)
    }

    .carta-ovr-p {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      color: var(--oro);
      letter-spacing: .06em;
      display: block;
      margin-top: -4px
    }

    .carta-base {
      position: absolute;
      top: 70px;
      left: 10px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 4px
    }

    .carta-base-n {
      font-size: .65rem;
      font-weight: 700;
      color: rgba(255, 255, 255, .4);
      font-family: 'Bebas Neue', sans-serif
    }

    .carta-boost {
      font-size: .65rem;
      font-weight: 700;
      color: var(--verde);
      font-family: 'Bebas Neue', sans-serif
    }

    .carta-cond {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 4;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(0, 0, 0, .6);
      border: 1px solid rgba(255, 255, 255, .15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem
    }

    .carta-stat {
      position: absolute;
      bottom: 40px;
      right: 10px;
      z-index: 4;
      text-align: right
    }

    .carta-stat-v {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      color: #fff;
      line-height: 1;
      text-shadow: 0 0 12px rgba(240, 180, 41, .4)
    }

    .carta-stat-n {
      font-size: .55rem;
      font-weight: 700;
      color: var(--oro);
      text-transform: uppercase;
      letter-spacing: .08em;
      display: block
    }

    .carta-pot {
      position: absolute;
      bottom: 38px;
      left: 8px;
      z-index: 4;
      background: rgba(0, 0, 0, .75);
      border: 1px solid var(--oro);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: .52rem;
      font-weight: 700;
      color: var(--oro);
      max-width: calc(100% - 60px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .carta-nombre-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 4;
      padding: 0 8px 8px
    }

    .carta-nombre {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .04em;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .9)
    }

    .carta-ed {
      font-size: .58rem;
      font-weight: 700;
      color: var(--verde);
      text-align: center;
      display: block;
      letter-spacing: .05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-transform: uppercase;
      margin-top: 1px
    }

    /* TECNICO CARD */
    .tec-card {
      background: var(--card);
      border: 1px solid var(--borde);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color .2s
    }

    .tec-card:hover {
      border-color: var(--muted)
    }

    .tec-top {
      display: flex;
      gap: 14px;
      padding: 16px;
      align-items: center;
      cursor: pointer
    }

    .tec-top:hover .tec-name {
      color: var(--oro)
    }

    .tec-img {
      width: 76px;
      height: 76px;
      border-radius: 10px;
      object-fit: cover;
      background: #0e1218;
      border: 1px solid var(--borde);
      flex-shrink: 0
    }

    .tec-img-ph {
      width: 76px;
      height: 76px;
      border-radius: 10px;
      background: #0e1218;
      border: 1px solid var(--borde);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      flex-shrink: 0
    }

    .tec-name {
      font-weight: 700;
      font-size: 1rem;
      transition: color .2s
    }

    .tec-ed {
      font-size: .75rem;
      color: var(--verde);
      margin-top: 3px
    }

    .tec-badges {
      display: flex;
      gap: 5px;
      margin-top: 6px;
      flex-wrap: wrap
    }

    .badge {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: .7rem;
      font-weight: 700
    }

    .badge-oro {
      background: var(--oro);
      color: #000
    }

    .badge-azul {
      background: #1e3a6e;
      color: #7eb3ff;
      border: 1px solid #2563eb44
    }

    .badge-verde {
      background: #1a2a1a;
      color: #4ade80;
      border: 1px solid #10b98133
    }

    .tec-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #0e1218;
      border-top: 1px solid var(--borde);
      flex-wrap: wrap
    }

    .tec-count {
      font-size: .8rem;
      color: var(--apagado)
    }

    .tec-fuerza {
      font-size: .82rem;
      color: var(--oro);
      font-weight: 700;
      margin-left: auto
    }

    .btn-sm {
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 700;
      transition: all .2s
    }

    .btn-sm-oro {
      background: var(--oro);
      color: #000
    }

    .btn-sm-oro:hover {
      background: var(--oro2)
    }

    .btn-sm-abrir {
      background: var(--muted);
      color: var(--texto)
    }

    .btn-sm-abrir:hover {
      background: #4a5265
    }

    /* CARPETA BANNER */
    .banner {
      background: linear-gradient(135deg, #0e1218, #141e30);
      padding: 20px 24px;
      border-bottom: 1px solid var(--borde)
    }

    .banner-top {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px
    }

    .banner-img {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      object-fit: cover;
      border: 2px solid var(--borde)
    }

    .banner-img-ph {
      width: 90px;
      height: 90px;
      border-radius: 10px;
      background: #0e1218;
      border: 2px solid var(--borde);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      flex-shrink: 0
    }

    .banner-h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: .04em
    }

    .banner-sub {
      color: var(--verde);
      font-size: .82rem;
      font-weight: 600;
      margin-top: 3px
    }

    .banner-acciones {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px
    }

    .info-bloque {
      background: #0e1218;
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 12px
    }

    .info-titulo {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--apagado);
      margin-bottom: 8px
    }

    .info-fila {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      font-size: .8rem
    }

    .info-label {
      color: var(--apagado)
    }

    .info-val {
      font-weight: 700
    }

    .info-val-oro {
      color: var(--oro);
      font-weight: 700
    }

    .info-val-verde {
      color: var(--verde);
      font-weight: 700
    }

    .est-barra-wrap {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .est-barra-cont {
      flex: 1;
      height: 5px;
      background: var(--muted);
      border-radius: 3px;
      overflow: hidden
    }

    .est-barra {
      height: 100%;
      border-radius: 3px
    }

    /* VACIO */
    .vacio {
      text-align: center;
      padding: 60px 24px;
      color: var(--apagado);
      grid-column: 1/-1
    }

    .vacio-i {
      font-size: 3.5rem;
      margin-bottom: 12px;
      opacity: .4
    }

    .vacio h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted)
    }

    /* OVERLAYS */
    .overlay {
      position: fixed;
      inset: 0;
      background: #00000095;
      backdrop-filter: blur(6px);
      z-index: 200;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 80px 16px 16px;
      overflow-y: auto
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--borde);
      border-radius: 18px;
      width: 100%;
      max-width: 800px;
      max-height: 92vh;
      overflow-y: auto;
      position: relative
    }

    .form-modal {
      background: var(--card);
      border: 1px solid var(--borde);
      border-radius: 18px;
      width: 100%;
      max-width: 680px;
      max-height: 92vh;
      overflow-y: auto;
      position: relative
    }

    .modal-x {
      position: absolute;
      top: 14px;
      right: 16px;
      background: var(--muted);
      border: none;
      color: var(--texto);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      z-index: 1;
      transition: background .2s
    }

    .modal-x:hover {
      background: var(--rojo)
    }

    /* DETALLE */
    .det-header {
      display: flex;
      gap: 20px;
      padding: 22px;

    }

    .det-carta {

    }

    .det-carta .carta {

    }

    .det-info h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      letter-spacing: .04em;
      line-height: 1.1
    }

    .det-badges {
      display: flex;
      gap: 6px;
      margin: 8px 0;
      flex-wrap: wrap
    }

    .det-acciones {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }

    .btn-edit {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: .82rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      background: var(--oro);
      color: #000;
      transition: all .2s
    }

    .btn-edit:hover {
      background: var(--oro2)
    }

    .btn-del {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ef444430;
      cursor: pointer;
      font-weight: 700;
      font-size: .82rem;
      background: transparent;
      color: var(--rojo);
      transition: all .2s
    }

    .btn-del:hover {
      background: #ef444415
    }

    .det-body {
      padding: 18px 22px
    }

    .sec {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--oro);
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sec::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--borde)
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 16px
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0
    }

    .stat-n {
      font-size: .78rem;
      color: var(--apagado);
      flex: 1
    }

    .stat-b {
      width: 72px;
      height: 5px;
      background: var(--muted);
      border-radius: 3px;
      overflow: hidden
    }

    .stat-bf {
      height: 100%;
      border-radius: 3px
    }

    .stat-v {
      font-size: .85rem;
      font-weight: 700;
      min-width: 26px;
      text-align: right
    }

    .stat-mod {
      font-size: .68rem;
      color: var(--verde);
      margin-left: 2px
    }

    /* FORMULARIO */
    .form-header {
      padding: 20px 22px 0
    }

    .form-header h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.7rem;
      letter-spacing: .05em;
      color: var(--oro)
    }

    .form-header p {
      color: var(--apagado);
      font-size: .82rem;
      margin-top: 3px
    }

    .form-body {
      padding: 16px 22px 22px
    }

    .fgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .fg {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .fg.full {
      grid-column: 1/-1
    }

    .fg label {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--apagado)
    }

    .fg input,
    .fg select,
    .fg textarea {
      padding: 9px 11px;
      border-radius: 8px;
      background: #0e1218;
      border: 1px solid var(--borde);
      color: var(--texto);
      font-size: .9rem;
      outline: none;
      transition: border .2s;
      font-family: 'Inter', sans-serif
    }

    .fg input:focus,
    .fg select:focus,
    .fg textarea:focus {
      border-color: var(--oro)
    }

    .sep {
      grid-column: 1/-1;
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--oro);
      padding: 8px 0 4px;
      border-bottom: 1px solid var(--borde);
      margin-top: 6px
    }

    .upload-area {
      grid-column: 1/-1;
      border: 2px dashed var(--borde);
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      transition: border .2s;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px
    }

    .upload-area:hover {
      border-color: var(--oro)
    }

    .upload-area input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%
    }

    .upload-preview {
      max-height: 140px;
      border-radius: 8px;
      object-fit: contain;
      position: relative;
      z-index: 1
    }

    .form-acc {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--borde);
      grid-column: 1/-1
    }

    .btn-guardar {
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: .88rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      background: var(--oro);
      color: #000;
      transition: all .2s
    }

    .btn-guardar:hover {
      background: var(--oro2)
    }

    .btn-cancelar {
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid var(--borde);
      cursor: pointer;
      font-weight: 600;
      font-size: .88rem;
      background: transparent;
      color: var(--apagado);
      transition: all .2s
    }

    .btn-cancelar:hover {
      color: var(--texto)
    }

    .pot-hint {
      font-size: .72rem;
      color: var(--verde);
      margin-top: 3px;
      font-style: italic;
      grid-column: 1/-1
    }

    .oculto {
      display: none !important
    }

    /* ── CAMPO DE FÚTBOL ── */
    .campo-wrap {
      padding: 16px 24px 24px;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .campo-titulo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .06em;
      color: var(--oro);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .campo {
      position: relative;
      width: 100%;
      max-width: 460px;
      aspect-ratio: 460/620;
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(180deg, #1e7a1e, #228b22 25%, #1e7a1e 50%, #228b22 75%, #1e7a1e);
      border: 3px solid rgba(255, 255, 255, .25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .5)
    }

    .campo-lineas {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .campo-lineas svg {
      width: 100%;
      height: 100%
    }

    .campo-jugadores {
      position: absolute;
      inset: 0
    }

    .campo-slot {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      z-index: 2
    }

    .campo-circulo {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .8);
      overflow: hidden;
      background: #0e1218;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .5);
      transition: transform .2s
    }

    .campo-slot:hover .campo-circulo {
      transform: scale(1.12)
    }

    .campo-circulo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top
    }

    .campo-circulo-empty {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, .3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: rgba(255, 255, 255, .3)
    }

    .campo-ovr {
      background: var(--oro);
      color: #000;
      font-family: 'Bebas Neue', sans-serif;
      font-size: .75rem;
      padding: 1px 5px;
      border-radius: 4px;
      line-height: 1.2;
      font-weight: 700
    }

    .campo-pos {
      font-size: .6rem;
      font-weight: 700;
      color: rgba(255, 255, 255, .7);
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .campo-nombre {
      font-size: .62rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .8)
    }

    .campo-vacio {
      font-size: .6rem;
      color: rgba(255, 255, 255, .3);
      text-align: center
    }

    /* ── MEJOR TÉCNICO ── */
    .mejores-grid {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .mejor-fila {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: var(--oscuro);
      border: 1px solid var(--borde);
      transition: border-color .2s
    }

    .mejor-fila.mejor-top {
      border-color: var(--oro);
      background: linear-gradient(90deg, #1a1500, #0e1218)
    }

    .mejor-rank {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      width: 22px;
      text-align: center
    }

    .mejor-img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid var(--borde)
    }

    .mejor-nombre {
      flex: 1;
      font-weight: 600;
      font-size: .88rem
    }

    .mejor-ovr {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      color: var(--oro)
    }

    .mejor-dif {
      font-size: .8rem;
      font-weight: 700;
      min-width: 30px;
      text-align: right
    }

    .mejor-sin {
      color: var(--apagado);
      font-size: .85rem;
      font-style: italic;
      padding: 8px 0
    }

    .campo-slot {
      cursor: grab;
      user-select: none;
      touch-action: none
    }

    .campo-slot:active {
      cursor: grabbing
    }

    .campo-slot.dragging-now {
      opacity: .85;
      z-index: 50 !important
    }

    .campo-slot.dragging-now .campo-circulo {
      transform: scale(1.18);
      box-shadow: 0 4px 24px rgba(240, 180, 41, .6)
    }

    .campo-export-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 460px
    }

    .campo-titulo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .06em;
      color: var(--oro);
      flex: 1
    }

    .campo-hint {
      font-size: .72rem;
      color: var(--apagado);
      margin-top: 8px;
      text-align: center;
      max-width: 460px
    }

    .pizarra-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      background: #0e1218;
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 10px;
      width: 100%;
      max-width: 460px
    }

    .piz-sep {
      width: 1px;
      height: 24px;
      background: var(--borde);
      margin: 0 2px
    }

    .piz-btn {
      padding: 5px 10px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 700;
      transition: all .2s;
      background: var(--muted);
      color: var(--texto)
    }

    .piz-btn:hover {
      background: #4a5265
    }

    .piz-btn.activo {
      background: var(--oro);
      color: #000
    }

    .piz-color {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color .2s;
      flex-shrink: 0
    }

    .piz-color.activo {
      border-color: #fff;
      transform: scale(1.2)
    }

    .piz-width {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--borde);
      background: #0e1218;
      color: var(--texto);
      font-size: .8rem;
      cursor: pointer;
      outline: none
    }

    .pizarra-activa #campo-jugs .campo-slot {
      pointer-events: none !important
    }

    /* ── HISTORIAL ── */
    .historial-entry {
      background: var(--oscuro);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px
    }

    .hist-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px
    }

    .hist-fecha {
      font-size: .73rem;
      font-weight: 700;
      color: var(--apagado)
    }

    .hist-ovr {
      font-size: .82rem;
      font-weight: 700;
      color: var(--texto);
      flex: 1
    }

    .hist-cambios {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .hist-fila {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .78rem;
      padding: 2px 0;
      border-bottom: 1px solid var(--borde)
    }

    .hist-fila:last-child {
      border-bottom: none
    }

    .hist-nom {
      color: var(--apagado);
      flex: 1
    }

    .hist-val-old {
      color: var(--apagado);
      min-width: 24px;
      text-align: right
    }

    .hist-arrow {
      color: var(--apagado);
      font-size: .7rem
    }

    .hist-val-new {
      font-weight: 700;
      min-width: 24px
    }

    .hist-dif {
      font-size: .72rem;
      font-weight: 700;
      min-width: 28px;
      text-align: right
    }

    .hist-primera {
      font-size: .75rem;
      color: var(--apagado);
      font-style: italic;
      padding: 4px 0
    }

    /* ── MEJOR XI ── */
    .xi-wrap {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px
    }

    .xi-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 460px
    }

    .xi-titulo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .06em;
      color: var(--oro);
      flex: 1
    }

    .xi-suplentes-wrap {
      width: 100%;
      max-width: 460px
    }

    .xi-sup-titulo {
      font-size: .7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--apagado);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .xi-sup-titulo::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--borde)
    }

    .xi-sup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px
    }

    .xi-empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--apagado)
    }

    /* Coach card animation */
    @keyframes tecGlow {
      0% {
        box-shadow: 0 8px 28px rgba(240, 180, 41, .6), 0 0 18px rgba(240, 180, 41, .3);
        border-color: #f0b429
      }

      33% {
        box-shadow: 0 8px 28px rgba(239, 68, 68, .6), 0 0 18px rgba(239, 68, 68, .3);
        border-color: #ef4444
      }

      66% {
        box-shadow: 0 8px 28px rgba(99, 102, 241, .6), 0 0 18px rgba(99, 102, 241, .3);
        border-color: #818cf8
      }

      100% {
        box-shadow: 0 8px 28px rgba(240, 180, 41, .6), 0 0 18px rgba(240, 180, 41, .3);
        border-color: #f0b429
      }
    }

    @keyframes tecRise {
      0% {
        transform: translateY(-3px) scale(1.02) rotate(-.4deg)
      }

      50% {
        transform: translateY(-5px) scale(1.03) rotate(.4deg)
      }

      100% {
        transform: translateY(-3px) scale(1.02) rotate(-.2deg)
      }
    }

    .tec-card:hover {
      animation: tecRise 1.5s ease-in-out infinite, tecGlow 2s linear infinite;
      position: relative;
      z-index: 10;
      cursor: pointer;
    }

    /* Sort bar */
    .sort-btn {
      padding: 7px 13px;
      border-radius: 7px;
      border: 1px solid var(--borde);
      background: var(--card);
      color: var(--apagado);
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap
    }

    .sort-btn.activo {
      background: var(--oro);
      color: #000;
      border-color: var(--oro)
    }

    .sort-btn:hover:not(.activo) {
      border-color: var(--muted);
      color: var(--texto)
    }

    /* Datalist input */
    .fg input[list] {
      background: #0e1218
    }

    /* XI en carpeta */
    .carp-xi-wrap {
      padding: 0 24px 20px
    }

    .carp-xi-campo {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 460/620;
      border-radius: 8px;
      overflow: hidden;
      margin: 10px auto 0;
      background: linear-gradient(180deg, #1e7a1e, #228b22 25%, #1e7a1e 50%, #228b22 75%, #1e7a1e);
      border: 2px solid rgba(255, 255, 255, .2)

    .carp-xi-sups {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));

      margin-top: 12px;

    }

      padding: 20px 24px

    .comp-selectors {

      align-items: center;
      gap: 12px;

      flex-wrap: wrap

    .comp-select-box {

      min-width: 200px;
      background: var(--card);
      border: 2px solid var(--borde);

      display: flex;
      align-items: center;
      gap: 10px

      background: linear-gradient(135deg, #0e1218, #0e1a30)

    .comp-bloque-head {

    .comp-bloque-titulo {

    .comp-bar-wrap {
      width: 80px;
      height: 6px;
      background: var(--muted);
      border-radius: 3px;
      overflow: hidden
    }

    .comp-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width .5s ease
    }

    .comp-estilo-val {
      font-size: .82rem;
      font-weight: 700;
      min-width: 24px;
      text-align: right
    }

    .comp-pot-badge {
      display: inline-block;
      background: #2a1e3a;
      color: #c084fc;
      border: 1px solid #7c3aed44;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: .72rem;
      font-weight: 700;
      margin: 3px 3px 0 0
    }

    .comp-jugador-fila {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--borde);
      cursor: pointer;
      transition: background .15s
    }

    .comp-jugador-fila:hover {
      background: rgba(255, 255, 255, .04);
      border-radius: 6px
    }

    .comp-jugador-fila:last-child {
      border-bottom: none
    }

    .comp-jug-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--borde);
      flex-shrink: 0;
      object-position: top
    }

    .comp-jug-img-ph {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      flex-shrink: 0
    }

    .comp-jug-pos {
      font-size: .65rem;
      font-weight: 700;
      color: var(--azul, #60a5fa);
      min-width: 28px;
      text-align: center
    }

    .comp-jug-nombre {
      font-size: .82rem;
      font-weight: 600;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .comp-jug-ovr {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: var(--oro)
    }

    .comp-jug-ed {
      font-size: .65rem;
      color: var(--verde)
    }

    .comp-placeholder {
      text-align: center;
      padding: 40px 20px;
      color: var(--apagado)
    }

    .comp-placeholder .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      opacity: .4
    }

    .comp-placeholder p {
      font-size: .85rem
    }

    .comp-sec-header {
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--apagado);
      padding: 8px 0 4px;
      border-bottom: 1px solid var(--borde);
      margin-bottom: 4px
    }

    .comp-jug-fila-unico {
      opacity: .6
    }

    .comp-jug-fila-comun {
      background: rgba(16, 185, 129, .05)
    }

    /* Dorsal en la carta */
    .carta-dorsal {
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 6;
      font-family: 'Bebas Neue', sans-serif;
      font-size: .9rem;
      line-height: 1;
      color: rgba(255, 255, 255, .95);
      letter-spacing: .04em;
      background: rgba(0, 0, 0, .72);
      border-radius: 0 6px 0 0;
      padding: 3px 7px 4px 6px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 1);
    }

    /* Dorsal en el badge del detalle */
    .badge-dorsal {
      background: linear-gradient(135deg, #1e3a6e, #0e1a40);
      color: #60a5fa;
      border: 1px solid #2563eb55;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      padding: 2px 12px;
      letter-spacing: .06em;
      border-radius: 20px;
    }

    /* Input dorsal en formulario */
    .dorsal-input-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .dorsal-ocupados {
      font-size: .68rem;
      color: var(--apagado);
      margin-top: 2px;
      line-height: 1.4;
    }

    .dorsal-ok {
      color: var(--verde);
      font-size: .72rem;
      margin-top: 2px;
      font-weight: 700;
    }

    .dorsal-error {
      color: var(--rojo);
      font-size: .72rem;
      margin-top: 2px;
      font-weight: 700;
    }

    /* 3 columnas stats */
    .stats-3col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0 12px;
      align-items: start
    }

    .stats-col {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .stats-col-titulo {
      font-size: .65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      padding: 6px 0 5px;
      border-bottom: 2px solid;
      margin-bottom: 4px
    }

    .stats-col-ataque {
      color: #f87171;
      border-color: #f87171
    }

    .stats-col-defensa {
      color: #60a5fa;
      border-color: #60a5fa
    }

    .stats-col-fuerza {
      color: #fbbf24;
      border-color: #fbbf24
    }

    /* Progresion */
    .prog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 14px;
      margin-top: 4px
    }

    .prog-item {
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .prog-item label {
      font-size: .68rem;
      font-weight: 700;
      color: var(--apagado);
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .prog-item input {
      padding: 6px 10px;
      border-radius: 7px;
      background: #0e1218;
      border: 1px solid var(--borde);
      color: var(--texto);
      font-size: .9rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: .04em;
      outline: none;
      transition: border .2s;
      text-align: center
    }

    .prog-item input:focus {
      border-color: var(--oro)
    }

    .prog-save-btn {
      grid-column: 1/-1;
      padding: 9px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      background: var(--oro);
      color: #000;
      transition: all .2s;
      margin-top: 4px
    }

    .prog-save-btn:hover {
      background: var(--oro2)
    }

    /* ── RADAR ── */
    .radar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 0
    }

    .radar-wrap canvas {
      max-width: 280px;
      width: 100%
    }

    .radar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      justify-content: center;
      margin-top: 4px
    }

    .radar-legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: .68rem;
      color: var(--apagado)
    }

    .radar-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0
    }

    /* ── COMPARADOR JUGADORES ── */
    .jcomp-wrap {
      padding: 20px 24px
    }

    .jcomp-sel {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap
    }

    .jcomp-box {
      flex: 1;
      min-width: 200px;
      background: var(--card);
      border: 2px solid var(--borde);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .jcomp-box.sel-1 {
      border-color: #60a5fa
    }

    .jcomp-box.sel-2 {
      border-color: #f472b6
    }

    .jcomp-vs {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: var(--oro);
      flex-shrink: 0
    }

    .jcomp-stat-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 0;
      border-bottom: 1px solid var(--borde)
    }

    .jcomp-stat-row:last-child {
      border-bottom: none
    }

    .jcomp-stat-nom {
      font-size: .73rem;
      color: var(--apagado);
      flex: 1;
      text-align: center
    }

    .jcomp-val {
      font-size: .88rem;
      font-weight: 700;
      min-width: 28px;
      text-align: center
    }

    .jcomp-bar-l {
      display: flex;
      justify-content: flex-end;
      flex: 1
    }

    .jcomp-bar-r {
      display: flex;
      justify-content: flex-start;
      flex: 1
    }

    .jcomp-b {
      height: 6px;
      border-radius: 3px;
      min-width: 2px;
      transition: width .4s ease
    }

    .jcomp-ganador {
      font-size: .65rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 10px
    }

    .jcomp-win1 {
      background: #60a5fa22;
      color: #60a5fa
    }

    .jcomp-win2 {
      background: #f472b622;
      color: #f472b6
    }

    .jcomp-empate {
      background: var(--muted);
      color: var(--apagado)
    }

    .jcomp-seccion {
      font-size: .68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      padding: 8px 0 3px;
      color: var(--apagado)
    }

    /* ── PROGRESIÓN HISTORIAL ── */
    .prog-hist-entry {
      background: var(--oscuro);
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      font-size: .78rem
    }

    .prog-hist-fecha {
      font-size: .7rem;
      color: var(--apagado);
      margin-bottom: 5px;
      font-weight: 700
    }

    .prog-hist-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px 8px
    }

    .prog-hist-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px
    }

    .prog-hist-nom {
      color: var(--apagado);
      font-size: .7rem
    }

    .prog-hist-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: .95rem;
      color: var(--oro)
    }

    .prog-hist-dif {
      font-size: .65rem;
      font-weight: 700
    }

    /* Stats 3-col responsive fix for narrow modals */
    @media (max-width: 560px) {
      .stats-3col {
        grid-template-columns: 1fr;
      }
    }

    /* Prog history */
    .prog-hist-section {
      margin-top: 4px
    }

    .prog-hist-entry {
      background: var(--oscuro);
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 6px
    }

    .prog-hist-fecha {
      font-size: .7rem;
      color: var(--apagado);
      margin-bottom: 5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .prog-hist-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px 8px
    }

    .prog-hist-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: #0e1218;
      border-radius: 6px;
      padding: 5px 7px
    }

    .prog-hist-nom {
      color: var(--apagado);
      font-size: .62rem;
      text-transform: uppercase;
      letter-spacing: .04em
    }

    .prog-hist-row {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .prog-hist-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      color: var(--oro)
    }

    .prog-hist-dif {
      font-size: .65rem;
      font-weight: 700
    }

    .prog-save-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      flex-wrap: wrap;
      grid-column: 1/-1
    }

    .prog-save-btn {
      padding: 7px 16px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      background: var(--oro);
      color: #000;
      transition: all .2s
    }

    .prog-save-btn:hover {
      background: var(--oro2)
    }

    .prog-saved-msg {
      font-size: .75rem;
      color: var(--verde);
      font-weight: 700;
      opacity: 0;
      transition: opacity .4s
    }

    .prog-hist-details {
      margin-top: 10px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: var(--oscuro);
      overflow: hidden
    }

    .prog-hist-details summary {
      padding: 10px 12px;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 700;
      color: var(--apagado);
      list-style: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color .2s, background .2s
    }

    .prog-hist-details summary::-webkit-details-marker {
      display: none
    }

    .prog-hist-details summary::before {
      content: '▶';
      font-size: .6rem;
      transition: transform .2s
    }

    .prog-hist-details[open] summary::before {
      transform: rotate(90deg)
    }

    .prog-hist-details summary:hover {
      color: var(--oro);
      background: #0e1218
    }

    .prog-hist-details .prog-hist-pasado {
      padding: 0 12px 10px
    }

    /* ── DASHBOARD ── */
    @keyframes dashGlow {

      0%,
      100% {
        opacity: .6
      }

      50% {
        opacity: 1
      }
    }

    @keyframes dashSlideUp {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes dashBarFill {
      from {
        width: 0
      }

      to {
        width: var(--w)
      }
    }

    @keyframes dashPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(240, 180, 41, .35)
      }

      50% {
        box-shadow: 0 0 20px 4px rgba(240, 180, 41, .15)
      }
    }

    .dash-wrap {
      padding: 0 0 40px;
      overflow: visible
    }

    /* ═══════════════════════════════════════════════════════════════
       ✏️  SECCIÓN "TU PLANTILLA" 
       📍 PARA MOVER ARRIBA/ABAJO: CAMBIA "margin-top: 0px"
       💡 Más arriba = margin-top: -30px, Más abajo = margin-top: 30px
       ═══════════════════════════════════════════════════════════════ */
    .dash-hero {
      position: relative;
      margin-top: 0px;
      margin-bottom: -370px;
      padding: 18px 54px 40px;
      background: linear-gradient(135deg, #0a1020 0%, #121a35 40%, #1a1040 100%);
      border-bottom: 1px solid var(--borde);
      overflow: visible;
      z-index: 50;
      box-sizing: border-box;
      width: 100%
    }

    .dash-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 70% 20%, rgba(240, 180, 41, .12), transparent),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(37, 99, 235, .15), transparent);
      animation: dashGlow 4s ease-in-out infinite
    }

    .dash-hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: start
    }

    .dash-hero-titulo-wrap {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .dash-hero-escudo {
      height: 54px;
      width: auto;
      max-width: 64px;
      object-fit: contain;
      filter: drop-shadow(0 3px 14px rgba(0, 0, 0, .55));
      animation: dashSlideUp .5s ease both
    }

    .dash-hero-titulo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: .04em;
      background: linear-gradient(90deg, var(--oro), #ffe9a8 50%, var(--oro));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1
    }

    .dash-hero-sub {
      color: var(--apagado);
      font-size: .9rem;
      margin-top: 6px
    }

    .dash-hero-stats {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      flex-wrap: wrap
    }

    .dash-hero-stat {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--borde);
      border-radius: 10px;
      padding: 8px 14px
    }

    .dash-hero-stat-n {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      color: var(--oro)
    }

    .dash-hero-stat-l {
      font-size: .68rem;
      color: var(--apagado);
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .dash-podium {
      display: flex;
      gap: 13px;
      align-items: flex-end;
      position: sticky;
      top: 72px;
      align-self: start;
      margin-top: 60px
    }

    .dash-podium-item {
      text-align: center;
      animation: dashSlideUp .6s ease both
    }

    .dash-podium-item:nth-child(1) {
      animation-delay: .1s
    }

    .dash-podium-item:nth-child(2) {
      animation-delay: .2s
    }

    .dash-podium-item:nth-child(3) {
      animation-delay: .3s
    }

    .dash-podium-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--borde);
      background: linear-gradient(160deg, #0e1520, #1a2540);
      cursor: pointer;
      transition: transform .25s, box-shadow .25s, border-color .25s;
      box-shadow: 0 4px 16px #00000060
    }

    .dash-podium-card::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 10;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .22) 50%, transparent 100%);
      transform: translateX(-150%) skewX(-15deg);
      pointer-events: none;
    }

    .dash-podium-card:hover {
      animation: cartaFlip 1.8s ease-in-out infinite, cartaGlow 2s linear infinite;
      border-width: 2.5px;
      z-index: 100;
    }

    .dash-podium-card:hover::after {
      animation: shimmer 1.2s ease-in-out infinite;
    }

    .dash-podium-card.gold {
      border-color: #f0b429;
      box-shadow: 0 0 24px rgba(240, 180, 41, .3)
    }

    .dash-podium-img {
      width: 185px;
      height: 230px;
      object-fit: cover;
      object-position: top;
      display: block
    }

    .dash-podium-ovr {
      position: absolute;
      top: 4px;
      left: 16px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: #fff;
      text-shadow: 0 1px 6px #000
    }

    .dash-podium-nom {
      font-size: .62rem;
      padding: 4px 6px;
      color: var(--texto);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 185px
    }

    .dash-podium-rank {
      font-size: 2.3rem;
      color: var(--oro);
      font-weight: 800;
      margin-top: 8px;
      margin-bottom: 0;
      position: relative;
      z-index: 5;
      line-height: 1
    }

    /* ═══════════════════════════════════════════════════════════════
       ✏️  CARTAS Y MEDALLAS
       📍 PARA MOVER ARRIBA/ABAJO: CAMBIA "margin-top: 400px"
       💡 Más arriba = margin-top: 350px, Más abajo = margin-top: 450px
       ═══════════════════════════════════════════════════════════════ */
    .dash-body {
      padding: 0 24px;
      margin-top: 400px;
      position: relative;
      z-index: 2
    }

    .dash-kpi {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px
    }

    @media(max-width:900px) {
      .dash-kpi {
        grid-template-columns: repeat(2, 1fr)
      }

      .dash-hero-grid {
        grid-template-columns: 1fr
      }

      .dash-podium {
        justify-content: center;
        margin-top: 16px
      }
    }

    @media(max-width:520px) {
      .dash-kpi {
        grid-template-columns: 1fr
      }
    }

    .dash-kpi-card {
      position: relative;
      border-radius: 14px;
      padding: 16px 18px;
      overflow: hidden;
      border: 1px solid var(--borde);
      animation: dashSlideUp .5s ease both;
      transition: transform .2s
    }

    .dash-kpi-card:hover {
      transform: translateY(-3px)
    }

    .dash-kpi-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: .12;
      pointer-events: none
    }

    .dash-kpi-card.kpi-ovr {
      background: linear-gradient(135deg, #141820, #1a2540)
    }

    .dash-kpi-card.kpi-ovr::before {
      background: radial-gradient(circle at 80% 20%, #f0b429, transparent 70%)
    }

    .dash-kpi-card.kpi-top {
      background: linear-gradient(135deg, #141820, #1e1530)
    }

    .dash-kpi-card.kpi-top::before {
      background: radial-gradient(circle at 80% 20%, #a855f7, transparent 70%)
    }

    .dash-kpi-card.kpi-tec {
      background: linear-gradient(135deg, #141820, #152a20)
    }

    .dash-kpi-card.kpi-tec::before {
      background: radial-gradient(circle at 80% 20%, #10b981, transparent 70%)
    }

    .dash-kpi-card.kpi-prog {
      background: linear-gradient(135deg, #141820, #2a1a10)
    }

    .dash-kpi-card.kpi-prog::before {
      background: radial-gradient(circle at 80% 20%, #f97316, transparent 70%)
    }

    .dash-kpi-icon {
      font-size: 1.4rem;
      margin-bottom: 6px;
      position: relative
    }

    .dash-kpi-titulo {
      font-size: .65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--apagado);
      position: relative
    }

    .dash-kpi-valor {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.4rem;
      color: var(--oro);
      line-height: 1.1;
      position: relative
    }

    .dash-kpi-sub {
      font-size: .74rem;
      color: var(--apagado);
      margin-top: 4px;
      position: relative
    }

    .dash-main {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      margin-bottom: 20px
    }

    @media(max-width:768px) {
      .dash-main {
        grid-template-columns: 1fr
      }
    }

    .dash-spotlight,
    .dash-coach-card {
      border-radius: 16px;
      border: 1px solid var(--borde);
      overflow: hidden;
      background: linear-gradient(145deg, var(--card), #101620);
      animation: dashSlideUp .6s ease .15s both
    }

    .dash-spotlight-inner {
      display: flex;
      min-height: 200px
    }

    .dash-spotlight-img {
      width: 160px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden
    }

    .dash-spotlight-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top
    }

    .dash-spotlight-img::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 60%, var(--card))
    }

    .dash-spotlight-info {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .dash-spotlight-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(90deg, #f0b42933, #f0b42911);
      border: 1px solid #f0b42955;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: .65rem;
      font-weight: 800;
      color: var(--oro);
      text-transform: uppercase;
      letter-spacing: .08em;
      width: fit-content;
      margin-bottom: 8px;
      animation: dashPulse 2.5s ease infinite
    }

    .dash-spotlight-nombre {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: .03em;
      line-height: 1
    }

    .dash-spotlight-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .dash-spotlight-pill {
      background: var(--oscuro);
      border: 1px solid var(--borde);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: .75rem;
      font-weight: 600
    }

    .dash-coach-card {
      padding: 0
    }

    .dash-coach-inner {
      display: flex;
      min-height: 200px
    }

    .dash-coach-photo {
      width: 160px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden
    }

    .dash-coach-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top
    }

    .dash-coach-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 55%, var(--card))
    }

    .dash-coach-info {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center
    }

    .dash-coach-nombre {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: .03em;
      line-height: 1
    }

    .dash-coach-meta {
      font-size: .78rem;
      color: var(--apagado);
      margin-top: 6px
    }

    .dash-coach-count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem;
      color: var(--verde);
      margin-top: 10px
    }

    .dash-panel {
      border-radius: 14px;
      border: 1px solid var(--borde);
      background: linear-gradient(145deg, var(--card), #101620);
      padding: 18px 20px;
      margin-bottom: 16px;
      animation: dashSlideUp .6s ease .25s both
    }

    .dash-panel-titulo {
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--apagado);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dash-pos-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px
    }

    .dash-pos-lbl {
      font-size: .75rem;
      font-weight: 700;
      min-width: 36px;
      color: var(--texto)
    }

    .dash-pos-track {
      flex: 1;
      height: 10px;
      background: var(--oscuro);
      border-radius: 5px;
      overflow: hidden
    }

    .dash-pos-fill {
      height: 100%;
      border-radius: 5px;
      background: linear-gradient(90deg, var(--azul), #60a5fa);
      animation: dashBarFill .8s ease both
    }

    .dash-pos-num {
      font-size: .75rem;
      font-weight: 700;
      color: var(--oro);
      min-width: 20px;
      text-align: right
    }

    .dash-strip {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin
    }

    .dash-strip::-webkit-scrollbar {
      height: 5px
    }

    .dash-strip::-webkit-scrollbar-thumb {
      background: var(--borde);
      border-radius: 3px
    }

    .dash-mini {
      flex-shrink: 0;
      width: 100px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--borde);
      background: linear-gradient(160deg, #0e1520, #1a2540);
      cursor: pointer;
      transition: transform .2s, border-color .2s
    }

    .dash-mini:hover {
      transform: scale(1.05);
      border-color: var(--oro)
    }

    .dash-mini img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      object-position: top
    }

    .dash-mini-info {
      padding: 5px 7px
    }

    .dash-mini-ovr {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: var(--oro)
    }

    .dash-mini-nom {
      font-size: .6rem;
      color: var(--apagado);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .dash-prog-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px
    }

    .dash-prog-lbl {
      font-size: .7rem;
      color: var(--apagado);
      min-width: 90px
    }

    .dash-prog-track {
      flex: 1;
      height: 8px;
      background: var(--oscuro);
      border-radius: 4px;
      overflow: hidden
    }

    .dash-prog-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #f97316, var(--oro));
      animation: dashBarFill .9s ease both
    }

    .dash-prog-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: .95rem;
      color: var(--oro);
      min-width: 28px;
      text-align: right
    }

    body.modo-claro .dash-hero {
      background: linear-gradient(135deg, #d8e0f0, #e8edf8, #d0d8ea)
    }

    body.modo-claro .dash-kpi-card {
      background: #fff
    }

    body.modo-claro .dash-spotlight,
    body.modo-claro .dash-coach-card,
    body.modo-claro .dash-panel {
      background: #fff
    }

    /* ── RESPONSIVE GLOBAL ── */
    @media(max-width:1100px) {
      .header {
        flex-wrap: wrap;
        height: auto;
        padding: 10px 16px;
        gap: 10px
      }

      .tabs {
        margin-left: 0;
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        flex-wrap: nowrap;
        padding-bottom: 2px
      }

      .tab {
        flex-shrink: 0;
        padding: 7px 12px;
        font-size: .76rem;
        white-space: nowrap
      }

      .logo span {
        font-size: 1.45rem
      }

      .modo-toggle,
      #btn-nuevo {
        flex-shrink: 0
      }
    }

    @media(max-width:768px) {
      .toolbar {
        flex-wrap: wrap;
        padding: 12px 16px;
        gap: 8px
      }

      .buscar {
        max-width: 100%;
        flex: 1 1 100%
      }

      #sort-bar {
        width: 100%
      }

      .contador {
        margin-left: 0;
        width: 100%;
        text-align: right
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        padding: 16px;
        gap: 24px 12px
      }

      .grid-tec {
        grid-template-columns: 1fr;
        padding: 16px
      }

      .banner {
        padding: 16px
      }

      .banner-top {
        flex-wrap: wrap
      }

      .info-grid {
        grid-template-columns: 1fr
      }

      .det-header {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 18px 16px
      }

      .det-carta {
        width: 120px
      }

      .det-info {
        width: 100%
      }

      .det-acciones {
        justify-content: center;
        flex-wrap: wrap
      }

      .det-body {
        padding: 14px 16px
      }

      .fgrid {
        grid-template-columns: 1fr
      }

      .form-header,
      .form-body {
        padding-left: 16px;
        padding-right: 16px
      }

      .comp-wrap,
      .jcomp-wrap,
      .xi-wrap,
      .dash-wrap {
        padding-left: 0;
        padding-right: 0
      }

      .comp-selectors,
      .jcomp-sel {
        flex-direction: column;
        align-items: stretch
      }

      .comp-select-box,
      .jcomp-box {
        min-width: 0;
        width: 100%
      }

      .jcomp-vs {
        align-self: center
      }

      .tec-footer {
        flex-wrap: wrap
      }

      .dash-body {
        padding: 0 16px
      }

      .dash-hero {
        padding: 20px 16px 70px
      }

      .dash-hero-titulo {
        font-size: 2.2rem
      }

      .dash-spotlight-inner,
      .dash-coach-inner {
        flex-direction: column;
        min-height: auto
      }

      .dash-spotlight-img,
      .dash-coach-photo {
        width: 100%;
        height: 200px
      }

      .dash-spotlight-img::after,
      .dash-coach-photo::after {
        background: linear-gradient(0deg, var(--card) 0%, transparent 55%)
      }

      .campo-wrap {
        padding: 12px 16px
      }

      .breadcrumb {
        padding: 8px 16px;
        flex-wrap: wrap
      }
    }

    @media(max-width:480px) {
      .header {
        padding: 8px 12px
      }

      .logo-escudo {
        height: 32px;
        max-width: 40px
      }

      .logo span {
        font-size: 1.15rem
      }

      .tab {
        padding: 6px 9px;
        font-size: .68rem
      }

      #btn-nuevo {
        padding: 7px 11px;
        font-size: .72rem
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        padding: 12px
      }

      .dash-kpi-valor {
        font-size: 2rem
      }

      .dash-hero-titulo {
        font-size: 1.8rem
      }

      .dash-hero-stats {
        gap: 8px
      }

      .dash-hero-stat {
        padding: 6px 10px
      }

      .dash-spotlight-nombre,
      .dash-coach-nombre {
        font-size: 1.5rem
      }

      .overlay {
        padding: 72px 8px 8px;
        align-items: flex-start
      }

      .modal,
      .form-modal {
        max-height: 96vh;
        border-radius: 14px
      }

      .prog-hist-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .dash-prog-lbl {
        min-width: 70px;
        font-size: .65rem
      }

      .carta:hover {
        animation: none;
        transform: none;
        box-shadow: 0 4px 16px #00000060
      }

      .sort-btn {
        padding: 5px 8px;
        font-size: .72rem
      }
    }

    /* ── SPOTLIGHT ──────────────────────────────────────────────────────────────── */
    .spotlight-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 80px 16px 16px
    }
    .spotlight-overlay.oculto { display: none }
    .spotlight-box {
      background: var(--card);
      border: 1px solid var(--borde);
      border-radius: 16px;
      width: 100%;
      max-width: 580px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
      animation: splEntrar .15s ease
    }
    @keyframes splEntrar {
      from { opacity:0; transform: translateY(-12px) scale(.97) }
      to   { opacity:1; transform: none }
    }
    .spotlight-input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--borde)
    }
    .spotlight-lupa { font-size: 1.3rem; flex-shrink: 0 }
    .spotlight-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.1rem;
      font-family: Inter, sans-serif;
      color: var(--texto);
      caret-color: var(--oro)
    }
    .spotlight-input::placeholder { color: var(--apagado) }
    .spotlight-esc {
      background: var(--muted);
      color: var(--apagado);
      border: 1px solid var(--borde);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: .72rem;
      font-family: Inter, sans-serif;
      cursor: pointer;
      flex-shrink: 0
    }
    .spotlight-results { max-height: 360px; overflow-y: auto }
    .spl-empty {
      padding: 32px 20px;
      text-align: center;
      color: var(--apagado);
      font-size: .9rem
    }
    .spl-grupo {
      padding: 8px 18px 4px;
      font-size: .67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--apagado)
    }
    .spl-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 18px;
      cursor: pointer;
      transition: background .12s
    }
    .spl-item:hover,
    .spl-item.activo { background: rgba(240,180,41,.08) }
    .spl-img {
      width: 42px;
      height: 52px;
      object-fit: cover;
      object-position: top;
      border-radius: 7px;
      border: 1px solid var(--borde);
      flex-shrink: 0
    }
    .spl-img-fb {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--oscuro);
      font-size: 1.4rem
    }
    .spl-info { flex: 1; min-width: 0 }
    .spl-nombre {
      font-weight: 600;
      font-size: .95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }
    .spl-meta { display: flex; gap: 5px; margin-top: 3px; flex-wrap: wrap }
    .spl-pill {
      background: var(--muted);
      color: var(--apagado);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: .65rem;
      font-weight: 600
    }
    .spl-ovr {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      color: var(--oro);
      flex-shrink: 0
    }
    .spotlight-hint {
      display: flex;
      gap: 16px;
      padding: 8px 18px;
      border-top: 1px solid var(--borde);
      font-size: .68rem;
      color: var(--apagado)
    }

    /* ── RESPONSIVE MOVIL EXTRA ─────────────────────────────────────────────── */
    @media(max-width:480px) {
      .logo span { font-size: 1rem }
      .tabs { gap: 1px }
      .tab { padding: 5px 7px; font-size: .62rem }
      .dash-podium-img { width: 85px; height: 105px }
      .dash-podium-nom { max-width: 85px; font-size: .55rem }
      .dash-podium-rank { font-size: 1.6rem }
      .dash-podium { gap: 6px }
      .dash-hero { padding: 14px 12px 60px }
      .dash-hero-titulo { font-size: 1.6rem }
      .dash-hero-sub { font-size: .78rem }
      .dash-hero-stats { gap: 6px; margin-top: 10px }
      .dash-hero-stat { padding: 5px 8px }
      .dash-hero-stat-n { font-size: 1.2rem }
      .dash-kpi { grid-template-columns: repeat(2,1fr); gap: 8px }
      .dash-kpi-valor { font-size: 1.8rem }
      .spotlight-overlay { padding: 60px 10px 10px }
      .spotlight-input { font-size: .95rem }
      .spotlight-hint { display: none }
      .spl-img { width: 36px; height: 44px }
      .spl-ovr { font-size: 1.1rem }
      .modal, .form-modal { border-radius: 12px; max-height: 94vh }
      .grid { grid-template-columns: repeat(2,1fr); gap: 14px 10px; padding: 10px }
      .grid-tec { grid-template-columns: 1fr; padding: 10px }
      .dash-panel { padding: 14px }
    }
    @media(max-width:360px) {
      .tab { padding: 4px 5px; font-size: .58rem }
      .dash-podium-img { width: 72px; height: 90px }
      .dash-podium-nom { max-width: 72px }
    }

    /* ── SQUAD BUILDER EXPORT ───────────────────────────────────────────────────── */
    .dash-export-btn {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: linear-gradient(135deg, #f0b429, #e09a00);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 9px 20px;
      font-family: Inter, sans-serif;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .03em;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 16px rgba(240,180,41,.35)
    }
    .dash-export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(240,180,41,.5)
    }
    .dash-export-btn:active { transform: translateY(0) }
    .dash-export-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none
    }

    /* Modal preview squad builder */
    .squad-preview-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(10px);
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px
    }
    .squad-preview-overlay.oculto { display: none }
    .squad-preview-box {
      background: var(--card);
      border: 1px solid var(--borde);
      border-radius: 18px;
      padding: 24px;
      max-width: 560px;
      width: 100%;
      animation: splEntrar .18s ease
    }
    .squad-preview-titulo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      color: var(--oro);
      margin-bottom: 4px
    }
    .squad-preview-sub {
      color: var(--apagado);
      font-size: .8rem;
      margin-bottom: 16px
    }
    .squad-preview-canvas {
      width: 100%;
      border-radius: 12px;
      display: block;
      border: 1px solid var(--borde)
    }
    .squad-preview-acciones {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo" id="logo-header"><span>eFootball Manager</span></div>
    <div class="tabs">
      <button class="tab activo" id="tab-inicio" onclick="cambiarTab('inicio')">🏠 Inicio</button>
      <button class="tab" id="tab-j" onclick="cambiarTab('jugadores')">⚽ Jugadores</button>
      <button class="tab" id="tab-t" onclick="cambiarTab('tecnicos')">📋 Técnicos</button>
      <button class="tab" id="tab-x" onclick="cambiarTab('xi')">🏆 Mejor XI</button>
      <button class="tab" id="tab-comp" onclick="cambiarTab('comparar')">⚖️ Comparar Técnico</button>
      <button class="tab" id="tab-jcomp" onclick="cambiarTab('jcomparar')">👥 Comparar Jugador</button>
    </div>
    <button class="modo-toggle" id="modo-btn" onclick="toggleModo()" title="Cambiar modo">🌙</button>
    <button class="modo-toggle" onclick="abrirSpotlight()" title="Buscar (Ctrl+K)" style="font-size:1rem">🔍</button>
    <button id="btn-nuevo" onclick="abrirNuevo()">+ Agregar</button>
  </div>

  <div class="breadcrumb oculto" id="breadcrumb">
    <button class="btn-back" onclick="cerrarCarpeta()">← Técnicos</button>
    <span>/</span>
    <b id="bc-nombre" style="color:var(--oro)"></b>
    <span id="bc-fuerza" style="margin-left:auto;color:var(--oro);font-weight:700;font-size:.82rem"></span>
  </div>

  <div class="toolbar oculto" id="toolbar">
    <input class="buscar" id="buscar" type="text" placeholder="🔍  Buscar...">
    <select class="filtro" id="filtro-pos">
      <option value="">Todas las posiciones</option>
      <option>PT</option>
      <option>DC</option>
      <option>LI</option>
      <option>LD</option>
      <option>MCD</option>
      <option>MDI</option>
      <option>MDD</option>
      <option>MC</option>
      <option>MO</option>
      <option>EXI</option>
      <option>EXD</option>
      <option>SD</option>
      <option>CD</option>
      <option>CAI</option>
      <option>CAD</option>
    </select>
    <div id="sort-bar" style="display:flex;gap:5px;flex-wrap:wrap">
      <button class="sort-btn activo" id="sb-ovr-d" onclick="setSort('ovr-desc')">OVR ↓</button>
      <button class="sort-btn" id="sb-ovr-a" onclick="setSort('ovr-asc')">OVR ↑</button>
      <button class="sort-btn" id="sb-nom" onclick="setSort('nombre')">A-Z</button>

  <script>
    // ── Estado global ─────────────────────────────────────────────────────────────
    let jugadores = [], tecnicos = [], carpetas = [], partidos = [], escudosCache = [];
    let tab = 'inicio', tecActual = null, editId = null, sortJug = 'ovr-desc';
    let comparT1 = null, comparT2 = null;
    let comparJ1 = null, comparJ2 = null;

    // ── Constantes ────────────────────────────────────────────────────────────────

      'Efecto +1', 'Efecto +2', 'Efecto +3',
      'Actitud defensiva +1', 'Actitud defensiva +2', 'Actitud defensiva +3',
      'Entrada +1', 'Entrada +2', 'Entrada +3',
      'Agresividad +1', 'Agresividad +2', 'Agresividad +3',
      'Dedicación defensiva +1', 'Dedicación defensiva +2', 'Dedicación defensiva +3',

      'Cobertura (PT) +1', 'Cobertura (PT) +2', 'Cobertura (PT) +3',
      'Velocidad +1', 'Velocidad +2', 'Velocidad +3',

    ];
