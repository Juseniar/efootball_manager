services:
  - type: web
    name: efootball-manager-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn django_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    disk:
      name: efootball-manager-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data/efootball_data
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: player-images
